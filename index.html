<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIN135: ToDo List App</title>
</head>
 
<body>
    <h1>Todo List</h1>
    <form>
        <div class="top-field">
            <input type="text" id="task" name="task" placeholder="What needs to be done?" required>
            <input type="number" id="hours" name="hours" placeholder="0">
            <button type="submit">Add</button>
        </div>
        <div class="filters">
            <button type="submit">All</button>
            <button type="submit">Active</button>
            <button type="submit">Completed</button>
            <button type="submit">Mark all done</button>
        </div>
        <div class="list">
            <input type="checkbox">
            <p></p>
        </div>
    </form>
    <footer>
        <div class="footer">
            <p>items left, hours total</p>
            <p>Clear completed</p>
        </div>
        <div class="hint">
            <p>Easy: up to 2h, Medium: over 2h, Hard: over 5h</p>
            <p>Double click a task or its label to edit the text or hours. Press Enter to save, Esc to cancel.</p>
        </div>
    </footer>
</body>
</html>
